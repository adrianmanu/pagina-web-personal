services:
  - type: web
    name: automatizacion-datos-api
    runtime: python
    plan: free
    pythonVersion: "3.12.8"
    rootDir: projects/automatizacion-datos/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://adrianmanu.github.io,http://localhost:4173,http://localhost:5175

  - type: web
    name: inventory-api
    runtime: java
    plan: free
    rootDir: projects/inventory-api
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/inventory-api-2.0.0.jar
    envVars:
      - key: APP_JWT_SECRET
        generateValue: true
