spring.application.name=inventory-api
server.port=8080

spring.datasource.url=jdbc:h2:mem:inventorydb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

app.jwt.secret=${APP_JWT_SECRET:inventory-dev-secret-change-in-production-min-32-chars}
app.jwt.expiration-ms=86400000
app.cors.allowed-origins=http://localhost:5176,http://localhost:4173,https://adrianmanu.github.io
