spring.application.name=inventory-api
server.port=${PORT:8080}

# En producción (Render) se sobreescriben con SPRING_DATASOURCE_URL/USERNAME/PASSWORD (Postgres)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:inventorydb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

app.jwt.secret=${APP_JWT_SECRET:inventory-dev-secret-change-in-production-min-32-chars}
app.jwt.expiration-ms=86400000
# Orígenes CORS: ver SecurityConfig (localhost, pages.dev, devtunnels, trycloudflare, loca.lt)
app.cors.allowed-origins=http://localhost:5176,http://localhost:4173,https://adrianmanu.github.io

# Facturación electrónica SRI vía Datil (https://datil.dev)
datil.enabled=${DATIL_ENABLED:false}
datil.api-url=${DATIL_API_URL:https://link.datil.co}
datil.api-key=${DATIL_API_KEY:}
datil.certificate-password=${DATIL_CERTIFICATE_PASSWORD:}
datil.ambiente=${DATIL_AMBIENTE:1}
datil.ruc=${DATIL_RUC:}
datil.razon-social=${DATIL_RAZON_SOCIAL:}
datil.nombre-comercial=${DATIL_NOMBRE_COMERCIAL:}
datil.direccion=${DATIL_DIRECCION:}
datil.obligado-contabilidad=${DATIL_OBLIGADO_CONTABILIDAD:true}
datil.contribuyente-especial=${DATIL_CONTRIBUYENTE_ESPECIAL:}
datil.establecimiento-codigo=${DATIL_ESTABLECIMIENTO:001}
datil.punto-emision=${DATIL_PUNTO_EMISION:001}
datil.establecimiento-direccion=${DATIL_ESTABLECIMIENTO_DIRECCION:}
datil.iva-rate=${DATIL_IVA_RATE:15}
datil.iva-codigo-porcentaje=${DATIL_IVA_CODIGO:4}
datil.prices-include-iva=${DATIL_PRICES_INCLUDE_IVA:true}
datil.secuencial-inicial=${DATIL_SECUENCIAL_INICIAL:0}
datil.agente-retencion=${DATIL_AGENTE_RETENCION:false}
datil.agente-retencion-resolucion=${DATIL_AGENTE_RETENCION_RESOLUCION:}
datil.emission-offset-days=${DATIL_EMISSION_OFFSET_DAYS:0}

# Proveedor SRI: datil | factuplan (SaaS recomendado)
sri.provider=${SRI_PROVIDER:datil}

# Factuplan — motor SRI multi-RUC (https://factuplan.com.ec/api)
factuplan.enabled=${FACTUPLAN_ENABLED:false}
factuplan.api-url=${FACTUPLAN_API_URL:https://api-rest.factuplan.com.ec}
factuplan.api-key=${FACTUPLAN_API_KEY:}
factuplan.webhook-secret=${FACTUPLAN_WEBHOOK_SECRET:}

# Membresía StockFlow (SaaS)
membership.enforcement-enabled=${MEMBERSHIP_ENFORCEMENT:true}
membership.trial-days=${MEMBERSHIP_TRIAL_DAYS:14}

# Stripe — cobro internacional (opcional; Ecuador usa PayPhone)
stripe.enabled=${STRIPE_ENABLED:false}
stripe.api-key=${STRIPE_API_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
stripe.price-starter=${STRIPE_PRICE_STARTER:}
stripe.price-pro=${STRIPE_PRICE_PRO:}
stripe.success-url=${STRIPE_SUCCESS_URL:http://localhost:5176/membresia?success=1}
stripe.cancel-url=${STRIPE_CANCEL_URL:http://localhost:5176/membresia?cancel=1}

# PayPhone — cobro membresías Ecuador (recomendado)
payphone.enabled=${PAYPHONE_ENABLED:false}
payphone.token=${PAYPHONE_TOKEN:}
payphone.store-id=${PAYPHONE_STORE_ID:}
payphone.api-url=${PAYPHONE_API_URL:https://pay.payphonetodoesposible.com/api}
payphone.response-url=${PAYPHONE_RESPONSE_URL:http://localhost:5176/membresia}

# Usuario demo en servidor de staging (demo@stockflow.dev / demo1234)
stockflow.seed-demo=${STOCKFLOW_SEED_DEMO:false}
