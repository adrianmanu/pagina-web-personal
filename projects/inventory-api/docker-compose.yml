# Solo para desarrollo local: app + PostgreSQL
# Uso: docker compose up --build
# La API queda en http://localhost:8080

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stockflow
      POSTGRES_USER: stockflow
      POSTGRES_PASSWORD: stockflow
    ports:
      - "5432:5432"
    volumes:
      - stockflow_pg:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DATABASE_URL: postgresql://stockflow:stockflow@db:5432/stockflow
      APP_JWT_SECRET: local-dev-secret-minimo-32-caracteres
      SRI_PROVIDER: factuplan
      FACTUPLAN_ENABLED: "false"
      MEMBERSHIP_ENFORCEMENT: "false"
      STOCKFLOW_SEED_DEMO: "true"
    depends_on:
      - db

volumes:
  stockflow_pg:
