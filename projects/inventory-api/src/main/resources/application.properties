spring.application.name=inventory-api
server.port=${PORT:8080}

# En producción (Render) se sobreescriben con SPRING_DATASOURCE_URL/USERNAME/PASSWORD (Postgres)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:inventorydb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

app.jwt.secret=${APP_JWT_SECRET:inventory-dev-secret-change-in-production-min-32-chars}
app.jwt.expiration-ms=86400000
app.cors.allowed-origins=http://localhost:5176,http://localhost:4173,https://adrianmanu.github.io
