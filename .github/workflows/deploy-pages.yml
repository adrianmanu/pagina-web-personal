name: Deploy Portafolio y Demos

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Configurar enlaces de GitHub en demos
        run: |
          USER=$(echo "${{ github.repository }}" | cut -d'/' -f1)
          REPO=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          sed -i "s/TU_USUARIO/${USER}/g" public/demos/config.js
          sed -i "s/pagina-web-personal/${REPO}/g" public/demos/config.js

      - name: Instalar dependencias del portafolio
        run: npm ci

      - name: Build portafolio
        run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_GITHUB_REPO: ${{ github.repository }}
          VITE_SITE_MODE: portfolio

      - name: Instalar dependencias del dashboard
        run: npm ci
        working-directory: projects/metrics-dashboard

      - name: Build dashboard
        run: npm run build
        working-directory: projects/metrics-dashboard
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/metrics-dashboard/

      - name: Instalar dependencias automatización de datos
        run: npm ci
        working-directory: projects/automatizacion-datos/frontend

      - name: Build automatización de datos
        run: npm run build
        working-directory: projects/automatizacion-datos/frontend
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/apps/automatizacion-datos/


      - name: Instalar dependencias inventario
        run: npm ci
        working-directory: projects/inventory-api/frontend

      - name: Build inventario frontend (demo)
        run: npm run build
        working-directory: projects/inventory-api/frontend
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/apps/inventory-api/

      - name: Guardar build demo inventario
        run: |
          rm -rf /tmp/stockflow-demo-dist
          cp -r projects/inventory-api/frontend/dist /tmp/stockflow-demo-dist

      - name: Build StockFlow live (API Render)
        run: npm run build
        working-directory: projects/inventory-api/frontend
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/apps/stockflow-live/
          VITE_USE_LIVE_API: 'true'
          VITE_API_BASE_URL: https://stockflow-apix.onrender.com

      - name: Instalar dependencias task manager
        run: npm ci
        working-directory: projects/task-manager-api/frontend

      - name: Build task manager frontend
        run: npm run build
        working-directory: projects/task-manager-api/frontend
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/apps/task-manager/

      - name: Preparar sitio para GitHub Pages
        run: |
          mkdir -p deploy
          cp -r dist/* deploy/
          mkdir -p deploy/metrics-dashboard
          cp -r projects/metrics-dashboard/dist/* deploy/metrics-dashboard/
          mkdir -p deploy/apps/automatizacion-datos
          cp -r projects/automatizacion-datos/frontend/dist/* deploy/apps/automatizacion-datos/
          mkdir -p deploy/apps/inventory-api
          cp -r /tmp/stockflow-demo-dist/* deploy/apps/inventory-api/
          mkdir -p deploy/apps/stockflow-live
          cp -r projects/inventory-api/frontend/dist/* deploy/apps/stockflow-live/
          mkdir -p deploy/apps/task-manager
          cp -r projects/task-manager-api/frontend/dist/* deploy/apps/task-manager/

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
